name: CI

on:
  push:
    branches: [main]
  pull_request:

# Note: no OPENAI_API_KEY is configured in CI. Integration tests detect its
# absence and skip themselves, so the test step runs unit tests only.

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: R1 zero-dep guard (core)
        run: pnpm depcheck:core

      - name: LLM-judge gate (no unconditional calls)
        run: pnpm judge:gate

      - name: Prompt @latest gate (no mutable PromptRef in committed tests/examples)
        run: pnpm prompts:gate

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
