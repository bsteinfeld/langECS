name: Release

# Publishes all seven packages/* to npm in lockstep when a v* tag is pushed.
# `pnpm version:all <version>` creates that tag; see RELEASING.md.
#
# Authentication is npm trusted publishing (OIDC) — no token is stored in this
# repo. Two consequences worth knowing:
#   * OIDC cannot create a package that does not exist yet, so v0.1.0 of each
#     package is published by hand once. From then on this workflow owns it.
#   * A trusted publisher created after 2026-09-03 allows `stage publish` only
#     unless direct publish is explicitly permitted, so this defaults to staging
#     and waits for a maintainer to approve with 2FA. Set the repository
#     variable NPM_PUBLISH_MODE=publish once direct publish is allowed on all
#     seven packages.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and pack the tarballs, but do not touch the registry'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # mint the OIDC token npm exchanges for publish rights
    env:
      # Bound here, not on the step: a step's `if` cannot read `secrets`, and
      # cannot read the step's own `env` either.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # >= 22.14 is npm's floor for trusted publishing; 24 is what CI already
      # covers, so a release is never the first time this Node version is used.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifests would publish a version nobody
      # can trace back to a commit. Fail before anything reaches the registry.
      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in packages/*/package.json; do
            pkg_version=$(node -p "require('./$manifest').version")
            pkg_name=$(node -p "require('./$manifest').name")
            if [ "$pkg_version" != "$tag_version" ]; then
              echo "::error file=$manifest::$pkg_name is $pkg_version but the tag says $tag_version"
              status=1
            fi
          done
          exit $status

      - name: Build
        run: pnpm build

      - name: Check packed dependencies and consumer identity
        run: pnpm check:packaging

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Proves the tarballs assemble (dist present, prepublishOnly clean) before
      # the registry is involved, and is the whole job on a dry run.
      - name: Pack (dry run)
        run: pnpm publish:dry

      # Only used if trusted publishing is not configured for a package yet —
      # OIDC takes precedence over a static token when both are available.
      # ~/.npmrc is user-level, which pnpm still trusts for credentials.
      - name: Configure token fallback
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        env:
          # `stage` is npm's default for new trusted publishers: CI uploads the
          # tarballs and they go live only once a maintainer approves them.
          PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'stage' }}
        run: |
          if [ "$PUBLISH_MODE" = "publish" ]; then
            pnpm -r --filter "./packages/*" publish --access public --no-git-checks
          else
            pnpm -r --filter "./packages/*" stage publish --access public --no-git-checks
            echo "::notice::Staged for release. Approve with 2FA: pnpm stage approve (or npmjs.com)"
          fi

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
