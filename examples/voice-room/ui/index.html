<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LangECS · Voice Room</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --panel-2: #1c232d;
        --line: #263041;
        --text: #e6edf3;
        --muted: #8b98a9;
        --accent: #6ea8fe;
        --user: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2230, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        padding: 18px 24px; border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
      header .sub { color: var(--muted); font-size: 13px; }
      .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 160px; }

      .stage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
      .persona {
        background: linear-gradient(180deg, var(--panel-2), var(--panel));
        border: 1px solid var(--line); border-radius: 14px; padding: 14px;
        transition: box-shadow .2s, border-color .2s, transform .2s;
      }
      .persona.speaking {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 8px 30px -8px var(--accent);
        transform: translateY(-2px);
      }
      .persona .top { display: flex; align-items: center; gap: 10px; }
      .avatar {
        width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
        font-weight: 700; color: #0e1116; flex: none;
      }
      .persona .name { font-weight: 650; }
      .persona .blurb { color: var(--muted); font-size: 12px; margin-top: 2px; min-height: 30px; }
      .meter { height: 6px; border-radius: 4px; background: #0c1017; overflow: hidden; margin-top: 8px; }
      .meter > span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .35s ease; }
      .meter-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

      .log { display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
      .msg .who { font-size: 12px; font-weight: 650; margin-bottom: 2px; }
      .msg.user { align-self: flex-end; background: #17301f; border-color: #245234; }
      .msg.user .who { color: var(--user); }
      .status { text-align: center; color: var(--muted); font-size: 13px; padding: 8px; font-style: italic; }

      .dock {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 16px;
        background: linear-gradient(180deg, transparent, var(--bg) 30%);
        display: flex; flex-direction: column; align-items: center; gap: 10px;
      }
      .talk {
        width: 100%; max-width: 520px; padding: 16px; border-radius: 14px; border: 1px solid var(--line);
        background: var(--accent); color: #08111f; font-size: 16px; font-weight: 700; cursor: pointer;
        user-select: none; -webkit-user-select: none; touch-action: none; transition: transform .08s, background .15s;
      }
      .talk:active, .talk.recording { transform: scale(.99); background: #ff6b6b; color: #fff; }
      .talk.recording { box-shadow: 0 0 0 4px rgba(255,107,107,.25); }
      .row { display: flex; gap: 8px; width: 100%; max-width: 520px; }
      .row input {
        flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
        background: var(--panel); color: var(--text); font-size: 14px;
      }
      .row button {
        padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
        background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 14px;
      }
      .hint { color: var(--muted); font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>LangECS · Voice Room</h1>
      <span class="sub" id="status-line">connecting…</span>
    </header>
    <div class="wrap">
      <div class="stage" id="stage"></div>
      <div class="log" id="log"></div>
      <div class="status" id="room-status"></div>
    </div>
    <div class="dock">
      <div class="talk" id="talk">🎙 Hold to talk (or type below)</div>
      <div class="row">
        <input id="text-input" placeholder="…or type a message and press Enter" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
